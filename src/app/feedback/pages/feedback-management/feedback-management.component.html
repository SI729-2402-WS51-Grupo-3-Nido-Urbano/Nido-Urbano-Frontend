<div class="feedback-container">
  <h2 class="feedback-title">{{ 'FEEDBACK.TITLE' | translate }}</h2>

  <!-- Tabla de Feedbacks -->
  <table mat-table [dataSource]="feedbacks" class="mat-elevation-z8 feedback-table">

    <!-- Columnas de la tabla -->
    <ng-container matColumnDef="user_name">
      <th mat-header-cell *matHeaderCellDef> {{ 'FEEDBACK.USER_NAME' | translate }} </th>
      <td mat-cell *matCellDef="let feedback"> {{ feedback.userName }} </td>
    </ng-container>

    <ng-container matColumnDef="score">
      <th mat-header-cell *matHeaderCellDef> {{ 'FEEDBACK.SCORE' | translate }} </th>
      <td mat-cell *matCellDef="let feedback"> {{ feedback.score }} </td>
    </ng-container>

    <ng-container matColumnDef="comments">
      <th mat-header-cell *matHeaderCellDef> {{ 'FEEDBACK.COMMENTS' | translate }} </th>
      <td mat-cell *matCellDef="let feedback"> {{ feedback.comments }} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> {{ 'FEEDBACK.ACTIONS' | translate }} </th>
      <td mat-cell *matCellDef="let feedback" class="action-buttons">
        <button mat-icon-button (click)="editFeedback(feedback)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteFeedback(feedback)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Filas de la tabla -->
    <tr mat-header-row *matHeaderRowDef="['user_name', 'score', 'comments', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['user_name', 'score', 'comments', 'actions'];"></tr>
  </table>

  <!-- Botón para crear nuevo feedback -->
  <button mat-raised-button class="create-feedback-button" (click)="createNewFeedback()">
    {{ 'FEEDBACK.CREATE_NEW_FEEDBACK' | translate }}
  </button>

  <!-- Componente hijo para crear o editar feedbacks -->
  <app-feedback-create-and-edit
    *ngIf="selectedFeedback"
    [feedback]="selectedFeedback"
    [editMode]="editMode"
    (feedbackAdded)="onFeedbackAdded($event)"
    (feedbackUpdated)="onFeedbackUpdated($event)"
    (editCanceled)="onEditCanceled()">
  </app-feedback-create-and-edit>
</div>
