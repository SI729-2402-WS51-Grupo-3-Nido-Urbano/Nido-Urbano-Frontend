<div class="card-container">
<mat-card *ngIf="house">
  <mat-card-header>
    <mat-card-title>{{ house.price }}</mat-card-title>
    <mat-card-subtitle>{{ house.houseName }}-{{ house.houseType }}</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-image [src]="house.photo" alt="Photo of a House">
  <!--Seccion de detalles-->
  <mat-card-content>
    <section class="details-house-container">
        <table mat-table [dataSource]="[
          { Attributes: 'house_id', Values: house.id },
          { Attributes: 'userPropertyId', Values: house.userPropertyId },
          { Attributes: 'houseName', Values: house.houseName },
          { Attributes: 'address', Values: house.address },
          { Attributes: 'houseType', Values: house.houseType },
          { Attributes: 'houseModal', Values: house.houseModal },
          { Attributes: 'price', Values: house.price },
          { Attributes: 'size', Values: house.size },
          { Attributes: 'description', Values: house.description },
          { Attributes: 'publication_date', Values: house.publication_date },
          { Attributes: 'startsCalification', Values: house.startsCalification },
          { Attributes: 'statusLandlord', Values: house.statusLandlord }
        ]" class="mat-elevation-z8">
          <ng-container matColumnDef="Attributes">
            <th mat-header-cell *matHeaderCellDef>Attributes</th>
            <td mat-cell *matCellDef="let element">{{ element.Attributes }}</td>
          </ng-container>
          <ng-container matColumnDef="Values">
            <th mat-header-cell *matHeaderCellDef>Values</th>
            <td mat-cell *matCellDef="let element">{{ element.Values }}</td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </section>
  </mat-card-content>
  <!--Seccion de botones-->
  <mat-card-actions>
    <button mat-button class="mat-button" (click)="onBuy()">Obtener</button>
    <button mat-button class="mat-button" (click)="seeFeedbacks()">Ver comentarios</button>
  </mat-card-actions>
</mat-card>
</div>
