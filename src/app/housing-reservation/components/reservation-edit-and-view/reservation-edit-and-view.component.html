<!-- Create and Edit Form -->
<h4>{{ (editMode ? 'title.edit' : 'title.add') | translate }}</h4>
<div class="form-section">
  <form (ngSubmit)="onSubmit()" #reservationForm="ngForm" class="form-row">
    <mat-form-field>
      <input matInput type="datetime" placeholder="Start Date" name="start_date" required [(ngModel)]="reservation.startDate">
    </mat-form-field>
    <mat-form-field>
      <input matInput type="text" placeholder="End Date" name="end_date" required [(ngModel)]="reservation.endDate">
    </mat-form-field>
    <mat-form-field>
      <input matInput type="text" placeholder="House Address" name="house_address" required [(ngModel)]="reservation.houseAddress">
    </mat-form-field>
    <mat-form-field>
      <input matInput type="text" placeholder="House Name" name="house_name" required [(ngModel)]="reservation.houseName">
    </mat-form-field>
    <mat-form-field>
      <input matInput type="text" placeholder="Tenant Name" name="tenant_name" required [(ngModel)]="reservation.tenantName">
    </mat-form-field>
    <mat-form-field>
      <input matInput type="text" placeholder="Tenant Address" name="tenant_address" required [(ngModel)]="reservation.tenantAddress">
    </mat-form-field>
    <mat-form-field>
      <input matInput type="number" placeholder="House Id" name="house_id" required [(ngModel)]="reservation.houseId">
    </mat-form-field>

    <ng-container>
      <button mat-raised-button color="primary" type="submit">
        {{ editMode ? 'Update' : 'Add' }}
      </button>
      <button mat-raised-button color="warn" (click)="onCancel()">Cancel</button>
    </ng-container>
  </form>
</div>
